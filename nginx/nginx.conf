# FLIGHTLY — NGINX Configuration
# API Gateway: routes all requests to the correct microservice
# All traffic enters through port 80, NGINX decides which service handles it

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  # Allow large file uploads for profile photos (default is 1MB)
  client_max_body_size 50M;

  # ─── Upstream Service Definitions ────────────────────────────────────────────
  # These names match the Docker service names in docker-compose.yml

  upstream auth_service {
    server auth-service:3001;
  }

  upstream flight_service {
    server flight-service:3002;
  }

  upstream booking_service {
    server booking-service:3003;
  }

  upstream user_service {
    server user-service:3004;
  }

  upstream notification_service {
    server notification-service:3005;
  }

  # ─── Logging ──────────────────────────────────────────────────────────────────
  access_log /var/log/nginx/access.log;
  error_log  /var/log/nginx/error.log;

  # ─── Server Block ─────────────────────────────────────────────────────────────
  server {
    listen 80;
    server_name localhost;

    # Increase timeouts for development
    proxy_connect_timeout 60s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # Forward real client IP to services
    proxy_set_header Host            $host;
    proxy_set_header X-Real-IP       $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # ─── Auth Service: /api/auth/* → auth-service:3001 ───────────────────────
    location /api/auth/ {
      proxy_pass http://auth_service/auth/;
    }

    # ─── Flight Service: /api/flights/* → flight-service:3002 ────────────────
    location /api/flights/ {
      proxy_pass http://flight_service/flights/;
    }

    # ─── Booking Service: /api/bookings/* → booking-service:3003 ─────────────
    location /api/bookings/ {
      proxy_pass http://booking_service/bookings/;
    }

    # ─── User Service: /api/users/* → user-service:3004 ──────────────────────
    location /api/users/ {
      proxy_pass http://user_service/users/;
    }

    # ─── Notification Service: /api/notifications/* → notification-service:3005
    location /api/notifications/ {
      proxy_pass http://notification_service/notifications/;
    }

    # ─── Static Uploads: /uploads/* → user-service:3004/uploads/ ──────────────
    location /uploads/ {
      proxy_pass http://user_service/uploads/;
    }

    # ─── Health Check Endpoints ───────────────────────────────────────────────
    location /health/auth {
      proxy_pass http://auth_service/health;
    }

    location /health/flights {
      proxy_pass http://flight_service/health;
    }

    location /health/bookings {
      proxy_pass http://booking_service/health;
    }

    location /health/users {
      proxy_pass http://user_service/health;
    }

    location /health/notifications {
      proxy_pass http://notification_service/health;
    }

    # ─── NGINX itself health check ────────────────────────────────────────────
    location /health {
      return 200 '{"status":"healthy","service":"nginx-gateway"}';
      add_header Content-Type application/json;
    }

    # ─── 404 for unmatched routes ─────────────────────────────────────────────
    location / {
      return 404 '{"success":false,"message":"Route not found"}';
      add_header Content-Type application/json;
    }
  }
}
