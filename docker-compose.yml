# FLIGHTLY — Docker Compose
# Orchestrates: PostgreSQL, Redis, NGINX, and all 5 microservices
# Run with: docker-compose up -d
# Stop with: docker-compose down

version: "3.9"

networks:
  flightly-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local

services:
  # ─── PostgreSQL Database ──────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: flightly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: flightly
      POSTGRES_USER: flightly_user
      POSTGRES_PASSWORD: flightly_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Run initial migration on first startup
      - ./database/migrations:/docker-entrypoint-initdb.d
    networks:
      - flightly-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flightly_user -d flightly"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis Cache ──────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: flightly-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - flightly-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Auth Service (Port 3001) ─────────────────────────────────────────────────
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: flightly-auth
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: flightly
      DB_USER: flightly_user
      DB_PASSWORD: flightly_pass
      REDIS_URL: redis://redis:6379
      JWT_SECRET: flightly_jwt_secret_change_in_production_use_256bit_random_string
    ports:
      - "3001:3001"
    networks:
      - flightly-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─── Flight Service (Port 3002) ───────────────────────────────────────────────
  flight-service:
    build:
      context: ./services/flight-service
      dockerfile: Dockerfile
    container_name: flightly-flight
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3002
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: flightly
      DB_USER: flightly_user
      DB_PASSWORD: flightly_pass
      REDIS_URL: redis://redis:6379
      JWT_SECRET: flightly_jwt_secret_change_in_production_use_256bit_random_string
    ports:
      - "3002:3002"
    networks:
      - flightly-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─── Booking Service (Port 3003) ──────────────────────────────────────────────
  booking-service:
    build:
      context: ./services/booking-service
      dockerfile: Dockerfile
    container_name: flightly-booking
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3003
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: flightly
      DB_USER: flightly_user
      DB_PASSWORD: flightly_pass
      REDIS_URL: redis://redis:6379
      JWT_SECRET: flightly_jwt_secret_change_in_production_use_256bit_random_string
    ports:
      - "3003:3003"
    networks:
      - flightly-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─── User Service (Port 3004) ─────────────────────────────────────────────────
  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    container_name: flightly-user
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3004
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: flightly
      DB_USER: flightly_user
      DB_PASSWORD: flightly_pass
      REDIS_URL: redis://redis:6379
      JWT_SECRET: flightly_jwt_secret_change_in_production_use_256bit_random_string
    ports:
      - "3004:3004"
    networks:
      - flightly-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─── Notification Service (Port 3005) ────────────────────────────────────────
  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: flightly-notification
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3005
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: flightly
      DB_USER: flightly_user
      DB_PASSWORD: flightly_pass
      REDIS_URL: redis://redis:6379
      JWT_SECRET: flightly_jwt_secret_change_in_production_use_256bit_random_string
    ports:
      - "3005:3005"
    networks:
      - flightly-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─── NGINX API Gateway (Port 80) ─────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: flightly-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - flightly-network
    depends_on:
      - auth-service
      - flight-service
      - booking-service
      - user-service
      - notification-service
